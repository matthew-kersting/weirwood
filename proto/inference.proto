// gRPC service for privacy-preserving XGBoost inference under FHE.
//
// Wire contract for the `weirwood::transport::grpc` module. Generated by
// tonic-build at compile time from this file.
//
// Two RPCs:
//   * InitSession — client uploads its (large) ServerKey and gets back a
//                   session_id for subsequent Predict calls.
//   * Predict     — client sends N encrypted features for an existing
//                   session and receives the encrypted ensemble score.
//
// The actual byte payloads use tfhe-rs' `safe_serialize` framing and carry
// versioning information, so the server can reject mismatched key formats.

syntax = "proto3";
package weirwood.inference.v1;

service InferenceService {
  // Upload a ServerKey and start a session. Returns an opaque session_id.
  // The server must allow large request messages (~100-200 MB) for this RPC.
  rpc InitSession (InitSessionRequest) returns (InitSessionResponse);

  // Run inference for a previously-initialised session. The server uses the
  // ServerKey associated with `session_id` to evaluate the loaded model on
  // the supplied encrypted feature vector.
  rpc Predict (PredictRequest) returns (PredictResponse);
}

message InitSessionRequest {
  // tfhe-rs `safe_serialize`d `ServerKey`.
  bytes server_key = 1;
}

message InitSessionResponse {
  // Server-assigned UUID for use in subsequent Predict calls.
  string session_id = 1;

  // Metadata for the model the server has loaded for this session. The
  // client uses this to validate feature shapes and pick an activation
  // function — no need to ship the model to the client.
  ModelInfo model_info = 2;
}

message ModelInfo {
  // Number of features the model expects in each `Predict` call.
  uint32 num_features = 1;

  // Raw XGBoost objective string (e.g. "binary:logistic",
  // "reg:squarederror", "multi:softmax", "multi:softprob"). Anything
  // unrecognised is treated as identity activation by the convenience client.
  string objective_name = 2;

  // For `multi:softmax` / `multi:softprob` only — number of classes. Zero
  // otherwise.
  uint32 num_class = 3;
}

message PredictRequest {
  // Session id obtained from InitSession.
  string session_id = 1;

  // One safe_serialize'd FheInt32 per feature, in feature-index order.
  repeated bytes features = 2;
}

message PredictResponse {
  // One safe_serialize'd FheInt32 per output. For binary:logistic and
  // reg:squarederror this carries a single element (the raw pre-activation
  // ensemble score). The shape leaves room for future multi:softmax support
  // without breaking the wire format.
  repeated bytes encrypted_scores = 1;
}
