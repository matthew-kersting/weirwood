[package]
name = "weirwood"
version = "0.4.0"
edition = "2024"
description = "Privacy-preserving XGBoost inference via Fully Homomorphic Encryption"
license = "MIT"
repository = "https://github.com/matthew-kersting/weirwood"
documentation = "https://docs.rs/weirwood"
keywords = ["fhe", "xgboost", "machine-learning", "cryptography", "privacy"]
categories = ["cryptography", "science"]
readme = "README.md"
exclude = ["weirwood_1pager.md", "benchmarks/"]

[features]
transport = ["dep:tonic", "dep:prost", "dep:tokio"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
rayon = "1.11.0"

[dependencies.tfhe]
version = "1.6.1"
features = ["shortint", "integer"]

[dependencies.tonic]
version = "0.14"
optional = true

[dependencies.prost]
version = "0.14"
optional = true

[dependencies.tokio]
version = "1.52"
features = ["rt-multi-thread", "macros", "sync"]
optional = true

[build-dependencies]
tonic-build = "0.14"

[dev-dependencies]
approx = "0.5.1"
uuid = { version = "1.23.1", features = ["v4"] }
