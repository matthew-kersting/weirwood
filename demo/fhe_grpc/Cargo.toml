[package]
name = "fhe_grpc"
version = "0.1.0"
edition = "2024"

# Empty `[workspace]` makes this an independent project — copy this folder
# anywhere and `cargo run --release --bin server / --bin client` just works.
[workspace]

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[dependencies]
weirwood = { version = "1.0", features = ["transport"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tonic = "0.12"
